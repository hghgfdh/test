name: Auto HyperOS Unlocker

on:
  push:
    paths:
      - 'cookie.txt'  # Trigger workflow only if cookie.txt is edited
  workflow_dispatch:  # Allow manual triggering from GitHub UI

jobs:
  run_unlocker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install urllib3 colorama

      - name: Read cookie from file
        id: read_cookie
        run: |
          COOKIE=$(cat cookie.txt)
          echo "cookie=$COOKIE" >> $GITHUB_OUTPUT

      - name: Run the unlocker script
        run: |
          python auto_unlocker.py
        env:
          COOKIE_VALUE: ${{ steps.read_cookie.outputs.cookie }}
