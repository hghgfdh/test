name: Auto HyperOS Unlocker

on:
  push:  # Trigger on ANY push to ANY branch
  workflow_dispatch:  # Allow manual triggering from GitHub UI

jobs:
  run_unlocker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install urllib3 colorama

      - name: Create cookies.txt (if not exists)
        run: |
          # Create an empty cookies.txt if it doesn't exist
          touch cookies.txt
          # Optionally, you can add a placeholder cookie (replace with real ones)
          echo "# Add one _new_bbs_serviceToken per line" > cookies.txt

      - name: Run the unlocker script
        run: |
          python auto_unlocker.py
        env:
          # Optional: Override target time via environment variable
          TARGET_TIME: "59:59"
