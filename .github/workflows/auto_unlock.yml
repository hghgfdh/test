name: Auto HyperOS Unlocker

on:
  push:
  workflow_dispatch:

jobs:
  run_unlocker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install urllib3 colorama

      - name: Create cookies.txt with placeholder (if missing)
        run: |
          # Create cookies.txt only if it doesn't exist
          if [ ! -f "cookies.txt" ]; then
            echo "# Add one _new_bbs_serviceToken per line (one per line, no quotes)" > cookies.txt
            echo "# Example:" >> cookies.txt
            echo "# your_cookie_value_here" >> cookies.txt
            echo "" >> cookies.txt  # Add an empty line for clarity
          fi

      - name: List files (debugging)
        run: |
          ls -la
          echo "--- cookies.txt contents ---"
          cat cookies.txt

      - name: Run the unlocker script
        run: |
          python auto_unlocker.py
        env:
          TARGET_TIME: "59:59"
